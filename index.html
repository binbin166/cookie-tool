<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微博Cookie更新工具</title>
    <script src="sodium.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f7;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        h1 { font-size: 20px; margin-bottom: 16px; color: #333; }
        h2 { font-size: 16px; margin-bottom: 12px; color: #666; }
        .step {
            margin-bottom: 16px;
            padding: 12px;
            background: #f8f8f8;
            border-radius: 8px;
        }
        .step-num {
            display: inline-block;
            width: 24px;
            height: 24px;
            background: #24292e;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 24px;
            font-size: 14px;
            margin-right: 8px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            margin: 8px 0;
        }
        textarea { height: 120px; resize: vertical; }
        button {
            width: 100%;
            padding: 14px;
            background: #24292e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin: 8px 0;
        }
        button:disabled { background: #ccc; }
        .result {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }
        .success { background: #e8f5e9; color: #2e7d32; }
        .error { background: #ffebee; color: #c62828; }
        a { color: #0366d6; }
        .tip {
            font-size: 13px;
            color: #999;
            margin-top: 8px;
            line-height: 1.5;
        }
        .config-section {
            margin-bottom: 16px;
        }
        .config-section label {
            font-size: 14px;
            color: #666;
            display: block;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <h1>微博Cookie更新工具</h1>
    
    <div class="card">
        <h2>GitHub Token（只需填一次，自动保存）</h2>
        
        <div class="config-section">
            <label>GitHub Token（有repo权限）</label>
            <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx">
            <div class="tip">
                没有Token？<a href="https://github.com/settings/tokens/new?scopes=repo" target="_blank">点这里生成</a>，勾选 repo 权限
            </div>
        </div>
        
        <button onclick="saveConfig()">保存Token</button>
    </div>
    
    <div class="card">
        <h2>更新 Cookie</h2>
        
        <div class="step">
            <span class="step-num">1</span>
            打开微博登录，复制 Cookie
            <br><br>
            <a href="https://m.weibo.cn" target="_blank">
                <button style="background: #ff8200;">打开微博登录页</button>
            </a>
        </div>
        
        <div class="step">
            <span class="step-num">2</span>
            把 Cookie 粘贴到下面，点更新
            <textarea id="cookieInput" placeholder="在这里粘贴你复制的 Cookie..."></textarea>
            <button onclick="updateGithub()" id="updateBtn">更新到 GitHub</button>
        </div>
    </div>
    
    <div id="result" class="result"></div>

    <script>
        const GITHUB_OWNER = "binbin166";
        const GITHUB_REPO = "weibo-checkin";
        
        window.onload = function() {
            const token = localStorage.getItem('github_token');
            if (token) document.getElementById('token').value = token;
        };
        
        function saveConfig() {
            const token = document.getElementById('token').value.trim();
            if (!token) {
                showResult('请填写 GitHub Token', false);
                return;
            }
            localStorage.setItem('github_token', token);
            showResult('Token 已保存！以后不用再填了。', true);
        }
        
        async function updateGithub() {
            const token = document.getElementById('token').value.trim();
            const cookie = document.getElementById('cookieInput').value.trim();
            const resultDiv = document.getElementById('result');
            const btn = document.getElementById('updateBtn');
            
            if (!token) {
                showResult('请先填写并保存 GitHub Token', false);
                return;
            }
            
            if (!cookie || cookie.length < 100) {
                showResult('Cookie 太短了，是不是复制错了？', false);
                return;
            }
            
            if (typeof sodium === 'undefined') {
                showResult('加密库加载失败，请刷新页面重试', false);
                return;
            }
            
            btn.disabled = true;
            btn.textContent = '更新中...';
            showResult('正在获取 GitHub 公钥...', true);
            
            try {
                const keyUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/actions/secrets/public-key`;
                let res = await fetch(keyUrl, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                if (!res.ok) {
                    throw new Error(`获取公钥失败：${res.status} ${res.statusText}，请检查Token是否正确`);
                }
                
                const keyData = await res.json();
                const publicKey = keyData.key;
                const keyId = keyData.key_id;
                
                showResult('公钥获取成功，正在加密 Cookie...', true);
                
                if (typeof sodium.ready !== 'undefined') {
                    await sodium.ready;
                }
                const binkey = sodium.from_base64(publicKey, 1);
                const binsec = sodium.from_string(cookie);
                const encBytes = sodium.crypto_box_seal(binsec, binkey);
                const encryptedValue = sodium.to_base64(encBytes, 1);
                
                showResult('加密完成，正在上传到 GitHub...', true);
                
                const secretUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/actions/secrets/WEIBO_COOKIE`;
                res = await fetch(secretUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        encrypted_value: encryptedValue,
                        key_id: keyId
                    })
                });
                
                if (res.ok) {
                    showResult('✅ 更新成功！Cookie 已经更新到 GitHub Secrets，下次签到就会用新的 Cookie。', true);
                } else {
                    throw new Error(`上传失败：${res.status} ${res.statusText}`);
                }
            } catch (e) {
                showResult(`❌ 出错了：${e.message}`, false);
            } finally {
                btn.disabled = false;
                btn.textContent = '更新到 GitHub';
            }
        }
        
        function showResult(msg, isSuccess) {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result ' + (isSuccess ? 'success' : 'error');
            resultDiv.textContent = msg;
        }
    </script>
</body>
</html>
